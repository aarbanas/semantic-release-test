name: Semantic Release

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: environment to deploy to
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To create tags and releases
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn

      - name: Generate release notes and publish to Confluence
        id: semantic-release
        run: |
          OUTPUT=$(npx semantic-release 2>&1)
          echo "$OUTPUT"
          
          # Extract the full URL from the output
          FULL_URL=$(echo "$OUTPUT" | grep -o "Successfully updated PI page: https://[^[:space:]]*" | sed 's/Successfully updated PI page: //' | head -1)
          echo "confluence-url=$FULL_URL" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_PARENT_PAGE_ID: ${{ secrets.CONFLUENCE_PARENT_PAGE_ID }}

      - name: Echo the Confluence URL for debugging
        run: echo "Confluence Page URL - ${{ steps.semantic-release.outputs.confluence-url }}"
